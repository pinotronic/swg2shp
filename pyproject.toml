[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dwg2shp"
version = "0.1.0"
description = "Convertidor DWG/DXF a Shapefile para redes de agua potable"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
geometry = ["shapely>=2.0"]
dev = ["pytest>=7.0"]
build = [
    "pyinstaller>=6.0",
    "build>=1.2",
]

[project.scripts]
dwg2shp = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
